services:
  # --- EL MOTOR (PYTHON + FASTAPI) ---
  backend:
    build: .
    container_name: reto_ia_backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - WATCHPACK_POLLING=true
    command: uvicorn src.app:app --host 0.0.0.0 --port 8000 --reload

